# Bytebot Workflow Dependency Update Multi Package

## Action

Follow the dependency-update-multi-package workflow:
1. Identify outdated dependencies in each package.
2. Update package.json and package-lock.json in each affected package directory.
3. Commit all updated files together, often with detailed changelogs or dependency lists.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: packages/*/package.json, packages/*/package-lock.json

